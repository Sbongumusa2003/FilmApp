<ion-header>
  <ion-toolbar>
    <ion-title>Search Movies</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="search-content">
  <div class="search-bar-container">
    <ion-searchbar
      [(ngModel)]="searchQuery"
      placeholder="Search movies..."
      (keyup)="onSearchbarKeyup($event)"
      animated>
    </ion-searchbar>

    <ion-button
      expand="block"
      (click)="searchMovies()"
      class="search-btn"
      [disabled]="isLoading">
      {{ isLoading ? 'Searching...' : 'Search' }}
    </ion-button>
  </div>

  <ion-grid *ngIf="movies.length > 0">
    <ion-row>
      <ion-col size="6" *ngFor="let movie of movies">
        <div class="movie-card" (click)="goToDetail(movie)">
          <div class="poster-wrapper">
            <img
              [src]="movie.poster || 'assets/no-poster.png'"
              [alt]="movie.title"
              class="movie-poster"
              (error)="$any($event.target).src='assets/no-poster.png'"
            />
          </div>
          <div class="movie-info">
            <p class="movie-title">{{ movie.title }}</p>
            <p class="movie-year">{{ movie.year }}</p>
          </div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="empty-state" *ngIf="hasSearched && movies.length === 0 && !isLoading">
    <ion-icon name="film-outline" size="large"></ion-icon>
    <p>No movies found.</p>
  </div>

  <div class="initial-state" *ngIf="!hasSearched">
    <ion-icon name="search-outline" size="large"></ion-icon>
    <p>Search for a movie to get started.</p>
  </div>
</ion-content>
